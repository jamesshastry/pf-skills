# ─────────────────────────────────────────────────────────────────────
# CLUSTER 10 — cross-border retirement.
# Exercises three branches of the country table: a non-recognising
# destination (IN, contested), a recognising one (US, stay put), and one
# absent from the table entirely (PT).
# ─────────────────────────────────────────────────────────────────────
crossborder:
  destinations:
    # NON-RECOGNISING CASE — India treats the Roth wrapper as contested, which
    # is what inverts the conversion advice. Also past the 10-year treaty
    # horizon, which is a second, independent finding.
    - { country: IN, label: Bengaluru, years_until_move: 12,
        ordinary_income_rate: 0.30 }
    # RECOGNISING CASE — staying put. The US is the only jurisdiction
    # guaranteed to honour the wrapper, and "stay" belongs in the comparison as
    # a row rather than as an unstated assumption.
    - { country: US, label: stay in Austin, years_until_move: null,
        ordinary_income_rate: null }
    # UNKNOWN CASE — not in the table. Absence must read as "nobody checked",
    # never as "probably fine".
    - { country: PT, label: Lisbon, years_until_move: 14,
        ordinary_income_rate: null }

  roth_balance: 42000
  traditional_balance: 310000
  planned_conversion_annual: 40000

  locations:
    - { name: Austin, country: US, months_per_year: 7, monthly_spending: 7000,
        home_currency: true }
    # DAY-TEST CASE — five months is far under 182 days and still trips India's
    # 60-days-plus-365-over-four-years test. A cost decision that quietly
    # created a tax residency is the expensive failure mode here.
    - { name: Bengaluru, country: IN, months_per_year: 5,
        monthly_spending: 2600, home_currency: false }
  fixed_annual_costs: 18000
  # UNRESOLVED CASE — nobody has checked whether housing is carried in both
  # places year-round, which would erase most of the saving.
  duplicate_housing: null

  medicare:
    enrolled_part_b: true
    standard_premium_monthly: 185
    months_abroad_planned: 60
    # UNDETERMINABLE CASE — the intention decides the whole comparison, so both
    # arms get priced rather than one being assumed.
    will_return_to_us: null
    years_after_return: 20
    has_medigap: false
    expat_policy_premium_annual: null

# ─────────────────────────────────────────────────────────────────────
# CLUSTER 11 — expat filing. Hypothetical, and deliberately so.
#
# The Rivera household is US-resident, so this cluster has no validation
# case (ROADMAP.md says so; REVIEW.md A2 says why that claim is worth
# re-checking rather than asserting). What follows is an invented year
# abroad — tax year 2025, filed in 2026 — present so the four skills have
# something to run against, on the same footing as the mortgage block
# above. Read no conclusion about this household from it.
# ─────────────────────────────────────────────────────────────────────

presence:
  tax_year: 2025
  days:
    # One ledger, read by foreign-presence-tests AND state-domicile-exit.
    # `state:` on US stays is what makes the state day count answerable.
    - { country: US, state: TX, start: 2024-12-01, end: 2025-02-19,
        label: Austin }
    # FAILING-CALENDAR / PASSING-WINDOW CASE. Counted January to December
    # 2025 the 330-day test fails; counted from the departure date it
    # passes. That gap is the entire reason the window is searched rather
    # than the calendar year counted.
    - { country: PT, start: 2025-02-20, end: 2025-07-03, label: Lisbon }
    # TRANSIT CASE — a day over international waters is not a full day in a
    # foreign country even between two foreign points.
    - { country: XX, start: 2025-07-04, end: 2025-07-04, transit: true,
        label: repositioning }
    # GAP CASE — 2025-07-05 to 2025-07-07 is unaccounted for. Nobody
    # recorded it, so it counts against the 330, which is the conservative
    # direction and the one an examiner takes.
    - { country: PT, start: 2025-07-08, end: 2026-06-15, label: Lisbon }
    - { country: US, state: TX, start: 2026-06-16, end: 2026-08-30,
        label: Austin }
  bona_fide:
    # FAIL CASE — arrival in February means 2025 is not covered end to end.
    entire_tax_year_covered: false
    # FAIL CASE — the Austin lease was kept, which defeats a foreign tax
    # home regardless of the day count.
    us_abode_retained: true
    # OK CASE.
    claimed_nonresident_on_foreign_return: false
    # UNKNOWN CASE — nobody has answered. Not the same as satisfied.
    indefinite_assignment: null
  destination:
    country: PT
    # Asked for, never fetched. No country's rule is encoded in this repo.
    threshold_days: 183
    tax_year_start: 2025-01-01
    tax_year_end: 2025-12-31

expat:
  tax_year: 2025
  filing_status: married_joint
  foreign_earned_income: 150000
  foreign_tax_on_earned_income: 38000
  us_source_income: 30000
  foreign_unearned_income: 0
  planned_ira_contribution: 7000
  # Never claimed before, so choosing the credit is a free choice rather
  # than a five-year commitment. Set this true to see that branch.
  feie_elected_prior_year: false
  foreign_entities:
    # CFC CASE — a majority holding, so every obligation in the screen fires.
    - { name: Rivera Consultoria Lda, country: PT, kind: foreign_corporation,
        ownership_pct: 60, us_shareholder_pct: 60 }
    # NOT-A-CFC CASE — under the 10% US shareholder threshold.
    - { name: Iberia Tech Holdings, country: PT, kind: foreign_corporation,
        ownership_pct: 4, us_shareholder_pct: 4 }
    # NEITHER CASE — a disregarded entity is Form 8858, not the CFC rules.
    # It is the filing people miss because they screen for "corporation".
    - { name: side consulting, country: PT, kind: disregarded_entity,
        ownership_pct: 100 }

state_exit:
  # STICKY-ORIGIN CASE — California is in the cited table and has no
  # day-count bright line, so the checklist is the evidence.
  from_state: CA
  # CLEAN-DESTINATION CASE — Texas is in the table and levies no income tax.
  to_state: TX
  move_date: 2024-06-30
  new_domicile_established: true
  count_year: 2025
  severance:
    home: true
    family: true
    drivers_license: true
    vehicle_registration: true
    # OUTSTANDING CASE — recorded as not done.
    voter_registration: false
    banking: false
    estate_documents: false
    # business, days, professional_advisors, memberships and
    # mailing_address are left out on purpose: "nobody has checked" is a
    # different state from "not done", and the report keeps them apart.

# ── CLUSTER 12: PFIC holdings ───────────────────────────────────────────────
pfic_holdings:
  # COMPUTABLE CASE — long hold, no election available, full rate series above.
  - name: icici_india_equity
    kind: foreign_mutual_fund
    country: IN
    value: 61000
    basis: 22000
    acquired: 2016-06-15
    qef_statement_available: false
    marketable_on_qualified_exchange: false
  # UNKNOWN-REGIME CASE — nobody has asked the administrator, and the position
  # is below basis, which is the cheapest a PFIC is ever going to be to leave.
  - name: overseas_balanced_fund
    kind: foreign_mutual_fund
    country: GB
    value: 12000
    basis: 12500
    acquired: 2021-03-01
    qef_statement_available: null
    marketable_on_qualified_exchange: null

# ── CLUSTER 12: foreign pensions ────────────────────────────────────────────
foreign_pensions:
  # TREATY CASE — stays out of the trust forms, still inside FBAR and 8938.
  - name: uk_employer_scheme
    scheme: uk_workplace_pension
    balance: 48000
  # PROBLEM CASE — Indian EPF, employee-weighted contributions, so the table's
  # contested default is narrowed and it tips to foreign grantor trust.
  - name: epf_india
    scheme: in_epf
    balance: 31000
    employee_contributions_to_date: 26000
    employer_contributions_to_date: 18000
  # CONTESTED CASE — the same scheme with no contribution split recorded. The
