        - { id: stock-receipt, type: asset_receipt, start_month: 1,
            market_value: 260000, liquidate: false,
            source_event_id: windfall-stock-gift,
            asset_type: private_stock, holding_period: long_term,
            restriction_status: unrestricted,
            label: Synthetic family stock gift }

    # PURCHASE CASE — down payment converts assets; closing cost reduces worth.
    - id: inheritance-home
      label: Fund the modeled home purchase
      baseline: current
      kind: scenario
      as_of: 2026-08-30
      horizon_months: 24
      preliminary: true
      events:
        - { id: inheritance-receipt-home, type: cash_receipt, start_month: 1,
            gross_amount: 260000, tax_reserve: 0,
            source_event_id: windfall-inheritance,
            label: "Inheritance from Ana's aunt" }
        - { id: maple-ridge-purchase, type: home_purchase, start_month: 4,
            housing_adapter: true }
housing:
