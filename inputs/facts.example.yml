  # which is the branch the entry above does not exercise.
  - name: epf_india_dormant
    scheme: in_epf
    balance: 7000
  # UNKNOWN CASE — not in the cited table, reported as unknown rather than
  # resolved by analogy to the UK entry above.
  - name: kiwisaver
    scheme: nz_kiwisaver
    balance: 9000

# ── CLUSTER 15: charitable giving ───────────────────────────────────────────
charity:
  annual_gift: 9000
  candidate_holdings:
    # IN-KIND CASE — long-term and appreciated.
    - { name: Northwind, value: 22000, basis: 4000, held_days: 1200 }
    # LOSS CASE — donating in kind forfeits the loss; sell first, donate cash.
    - { name: intl_fund, value: 6000, basis: 9000, held_days: 800 }
    # SHORT-TERM CASE — deductible at basis only, so wait or give another lot.
    - { name: recent_lot, value: 8000, basis: 5000, held_days: 120 }

# ─────────────────────────────────────────────────────────────────────
# CLUSTER 13 — a2's design practice. Owner-operator, no employees.
# S-CORP-WINS CASE: a2 has no outside wages, so the full Social Security
# wage base is available to shelter, and the election nets ~$9.8k/yr after
# its $2,400 running cost.
# S-CORP-LOSES CASE: `alternate_scenarios` below, at a slow year's profit.
# The verdict flips with profit and one profit level only ever shows one
# side of it — which is the boundary CONTRIBUTING says a fixture must cross.
# ─────────────────────────────────────────────────────────────────────
business:
  owners: [a2]
  structure: schedule_c
  gross_revenue: 265000
  expenses: 61000
  field: graphic_design
  sstb: false
  ubia: 18000
  reasonable_salary_floor: 72000
  owner_outside_wages: 0
  s_corp_annual_cost: 2400
  taxable_income: 204000

  # S-CORP-LOSES BRANCH — the same household and the same $72k reasonable
  # salary floor, at a slow year's revenue. The salary floor now consumes
  # most of the profit, so there is little left to shelter as a distribution
  # and the election costs more than it saves.
  alternate_scenarios:
    - label: A slow year
      gross_revenue: 118000

  assets:
    # HEAVY VEHICLE, THIN MARGIN OVER THE 50% TEST — exercises the >6,000 lb
    # GVWR branch and the recapture warning together. Also the branch where
    # no first-year method has been chosen yet.
    - { description: Work SUV, cost: 82000, business_use: 0.55,
        gvwr_lbs: 7200, annual_business_miles: 14000,
        placed_in_service: 2026-03-02, first_year_method: null }

    # PASSENGER AUTO — exercises the §280F cap branch, both caps, and the
    # case where standard mileage in year one kept both methods open.
    - { description: Sedan, cost: 41000, business_use: 0.7,
        gvwr_lbs: 4100, annual_business_miles: 9000,
        actual_operating_cost: 4200, placed_in_service: 2026-01-15,
        first_year_method: standard_mileage }

    # NON-VEHICLE — no mileage option and no year-one lock, so the report
    # stays quiet about both.
    - { description: Large-format printer, cost: 26000, business_use: 1.0,
        placed_in_service: 2026-05-20 }

# ── CLUSTER 14: portfolio policy ────────────────────────────────────────────
portfolio:
  # IN-BAND CASE  — us_equity at 50.6% against a 50% target, ±5.0pp band.
  # OUT-OF-BAND   — cash +16.5pp (relative band, 1.2pp), bond -9.8pp and
  #                 intl_equity -7.3pp (absolute band, 5.0pp). Both branches
  #                 in one fixture, per CONTRIBUTING.
  target_allocation:
    us_equity: 0.50
    intl_equity: 0.20
    bond: 0.25
    cash: 0.05

  annual_contributions: 34000

  rebalancing:
    policy: bands
    # OVERDUE CASE — a quarterly band check last run in February.
    last_reviewed: 2026-02-01

  wash_sale:
    direct_index_provider: Meridian Direct
    # CONTINUOUS CASE — the exclusion list never reliably clears.
    harvesting_continuous: true
    # UNKNOWN CASE — a spouse's purchases count and nobody has checked.
    spouse_accounts_covered: null
    excluded_securities:
      # LIVE CASE — inside the 30-day window as of meta.as_of.
      - { ticker: XOM, reason: harvested_loss, sold_on: 2026-08-18, source: direct_index }
      # CLEARED CASE — outside it, and removable but for continuous harvesting.
      - { ticker: PFE, reason: harvested_loss, sold_on: 2026-05-02, source: direct_index }
      # UNDATED CASE — cannot be determined, so it stays on the list.
      - { ticker: KO,  reason: harvested_loss, source: direct_index }

# ── CLUSTER 16: healthcare & aging ──────────────────────────────────────────
healthcare:
  # SAFE-TO-DELAY CASE — 250 employees, so the group plan is primary and an
  # 8-month SEP opens when the coverage ends. Under 20 flips this to "Medicare
  # is primary, enrol at 65 or be uninsured for the Medicare share".
  working_past_65: true
  employer_employees: 250
  coverage_is_current_employment: true
  part_a_quarters: 40
  ltc:
    # TRANSFER CASE — a 5-year episode at 110000/yr is 139% of the 395000
    # investable (liquid 85000 + age_restricted 310000), so the portfolio is
    # exhausted before the episode ends and the survivor test fails outright.
    annual_cost_today: 110000
    cost_as_of: 2026-06-30
    survivor_annual_spending: 72000
    policies:
      # POLICY-IN-FORCE CASE — and a defective one: a 3-year benefit period
      # leaves the 5-year tail uncovered, and no inflation protection.
      - { id: ltc1, type: hybrid, insured: a1, daily_benefit: 200,
          benefit_period_years: 3, elimination_days: 90,
          inflation_protection: false, premium_annual: 4800 }

# ─────────────────────────────────────────────────────────────────────
# CLUSTER 17 — life transitions.
# The Rivera household is not simultaneously inheriting, marrying and
# divorcing. This section is a test vehicle, in the same spirit as the
# `housing.mortgage` block on a household that rents.
# ─────────────────────────────────────────────────────────────────────
transitions:
  windfall:
    # FOREIGN-SOURCE / STEPPED-UP CASE — over the $100K Form 3520 threshold,
    # not income on receipt, and still inside the 90-day pause at meta.as_of.
    - { id: windfall-inheritance, label: Inheritance from Ana's aunt,
        kind: inheritance, amount: 260000,
        received: 2026-07-15, source_foreign: true }
    # DOMESTIC / NO-STEP-UP CASE — ordinary wage income at vest, withheld at
    # the 22% supplemental rate against a 24% marginal rate, and the pause on
    # this one has elapsed. Both pause branches therefore appear at once.
    - { id: windfall-rsu, label: Northwind RSU vest, kind: equity_vest,
        amount: 95000,
        received: 2026-02-20, source_foreign: false }
    # STOCK RECEIPT CASE — same gross value as the cash inheritance, but with
    # carryover basis that must be known before sale proceeds can be compared.
    - { id: windfall-stock-gift, label: Synthetic family stock gift,
        kind: gift, amount: 260000,
        received: 2026-02-01, source_foreign: false }
  tax_withheld_ytd: 20900
  # HIGH-AGI CASE — over $150K, so the safe harbour is 110% not 100%.
  prior_year_tax: 38000
  prior_year_agi: 172000
  aca_marketplace_coverage: false
  medicare_within_lookback: false

  marriage:
    # SEPARATE-WINS CASE — filing separately costs $5,600 more in tax and
    # saves $11,280 of income-driven loan payment. Flip either loan figure and
    # the recommendation flips to joint, which is the other branch.
    tax_if_joint: 41200
    tax_if_separate_combined: 46800
    idr_annual_payment_joint: 14400
    idr_annual_payment_separate: 3120
    stale_beneficiary_accounts: [retirement_401k]
    independent_access: { a1: true, a2: false }

  divorce:
    parties: [a1, a2]
    assets:
      # EQUAL-ON-PAPER CASE — $200K each, $48K apart after tax. This is the
      # finding the skill exists for.
      - { name: roth_ira, kind: roth_ira, value: 200000, to: a1 }
      - { name: retirement_401k, kind: traditional_401k, value: 200000, to: a2 }
      # LOW-BASIS CASE — a $15K embedded gain that carries over on transfer.
      - { name: brokerage, kind: taxable, value: 45000, basis: 30000, to: a2 }
      # HIGH-BASIS CASE — nominally identical, worth $2,100 more after tax.
      - { name: inherited_stock, kind: taxable, value: 45000, basis: 44000,
          to: a1 }

# ── CLUSTER 18: investment property ─────────────────────────────────────────
# The Riveras rent their home (see `housing:` above) and own two rental
# properties. Two branches on purpose: one activity where the §469 gate
# stays shut and one where the short-stay exception opens it; one deal that
# clears the DSCR floor and one that does not.
# ── the property currently under offer ──────────────────────────────────────
# Distinct from `housing.purchase`, which holds the rent-vs-buy arithmetic.
# This holds what the disclosure package says about the same candidate.
#
# One block means one case, so this fixture is the DIFFICULT one: a pre-1978
# townhome in an association with weak reserves. The strong-association and
# detached-single-family branches are covered in tests/test_disclosure.py.
# ── Social Security, as the SSA statement gives it ──────────────────────────
# Amounts are read, never computed. The statement is the only source.
social_security:
  statement_date: 2026-09-15
  full_retirement_age: 67
  retirement_monthly: { 62: 2240, 67: 3200, 70: 3968 }
  disability_monthly: 3100
  survivors_monthly:
    spouse_at_fra: 3200
    # 75% of PIA, the same share the caregiver benefit uses.
    minor_child: 2380
    # FAMILY-MAXIMUM-BINDS CASE — two children plus a caregiver benefit sums
    # above this, so the cap is exercised rather than being decoration.
    family_maximum: 5600
  payable_abroad: null          # null = nobody has checked. Not "yes".
  totalization_agreement: false
  # UNRECORDED CASE — the spouse's own statement has never been pulled (four
  # credits; there may be nothing to project). Unknown, not zero: the skill
  # names the 50%-of-PIA threshold instead of a verdict.
  spouse_own_projected_monthly: null

property_review:
  # The household lives in TX; this candidate is in California. Disclosure law
  # follows the property, so `state` here overrides meta.jurisdiction.state —
  # reviewing a California package against Texas rules would be worse than
  # refusing. The WRONG-STATE refusal branch is covered in tests.
  state: CA
  # TYPE-MISMATCH CASE for ca-sfh-disclosure-review, which should say so and
  # point at the condo skill rather than reviewing a townhome as detached.
  property_type: townhome
  # PRE-1978 CASE — federal lead-based paint disclosure applies.
  year_built: 1974
  unit_count: 36
  # SB 326 CASE — wood-supported walkways over six feet, so Civ. Code §5551
  # applies and no report has been produced.
  elevated_elements: true
  documents_provided: [tds, spq, nhd, general_inspection, pest, title]
  hoa:
    monthly_dues: 420
    # WEAK-RESERVE CASE — below the 30% band.
    reserve_percent_funded: 0.24
    # ABOVE-FINANCING-THRESHOLD CASE — over 15%.
    delinquency_rate: 0.18
    reserve_contribution_share: 0.07
    litigation: construction_defect
    special_assessment_pending: true
    master_policy_non_renewed: false
    # BELOW-§4741-FLOOR CASE — a cap under 25%.
    rental_cap: 0.15
    packet_provided: [governing_documents, budget, minutes]
    sb326_report: none

real_estate:
  participation:
    # GATE-SHUT DRIVERS — MAGI is above the phase-out ceiling, and 260 of
    # 2,340 working hours is nowhere near the REPS 50% test.
    magi: 212000
    active_participation: true
    hours_real_property: 260
    hours_all_work: 2340
    grouping_election: false

  activities:
    # RENT-FIRST HOME CASE — a 15-month tenant phase before owner occupancy.
    # The high-income household has no open current-loss door, so the housing
    # transition must carry zero current tax benefit.
    - label: Maple Ridge home
      avg_stay_days: 365
      material_participation_hours: 37
      most_hours_of_anyone: false
      expected_loss: 12731
      suspended_losses: 0
    # SHUT CASE — long-term rental, passive per se, loss suspends.
    - label: Cedar Park duplex
      avg_stay_days: 365
      material_participation_hours: 120
      most_hours_of_anyone: true
      expected_loss: 22000
      suspended_losses: 14000
    # OPEN CASE — average stay of 4 days is inside the 7-day exception, so
    # material participation alone unlocks the loss against W-2 income.
    - label: Gulf Coast cabin
      avg_stay_days: 4
      material_participation_hours: 180
      most_hours_of_anyone: true
      expected_loss: 31000
      suspended_losses: 0

  deals:
    # INTEGRATION CASE — the proposed single-family home is rented for more
    # than one year before occupancy. Every amount is synthetic.
    - label: Maple Ridge home
      price: 520000
      closing_costs: 13750
      down_payment: 130000
      loan_rate: 0.0675
