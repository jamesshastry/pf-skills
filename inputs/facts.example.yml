# Deterministic what-if cases. They do not become current facts and ordinary
# skill runs never write their results back into this file.
scenario_planning:
  objective: compare_only
  scenarios:
    # CORRELATED LOSS CASE — income, vesting, match, stock and health move once.
    - id: job-loss-12m
      label: Primary earner unemployed for 12 months
      baseline: current
      kind: stress
      as_of: 2026-08-30
      horizon_months: 24
      currency: USD
      basis: nominal
      essential_spending_annual: 71100
      liquidation_order: [cash-main, taxable-brokerage]
      events:
        - id: northwind-separation
          type: employment_loss
          person_id: a1
          start_month: 1
          duration_months: 12
          after_tax_income_loss_monthly: 11652.25
          employee_contribution_loss_monthly: 3500
          employer_match_loss_monthly: 0
          severance_after_tax: 24175
          severance_month: 1
          unemployment_after_tax_monthly: 1850
          benefit_start_month: 2
          benefit_duration_months: 6
          replacement_health_cost_monthly: 975
          unvested_forfeiture: 41000
          employer_stock_change: -0.50
        - id: lower-pay-reemployment
          type: compensation_change
          start_month: 13
          after_tax_income_change_monthly: -1800
          retirement_contribution_change_monthly: -500

    # CASH RECEIPT CASE — explicit zero reserve because inheritance is not income.
    - id: inheritance-cash
      label: Keep inheritance in cash
      baseline: current
      kind: scenario
      as_of: 2026-08-30
      horizon_months: 24
      preliminary: true
      events:
        - { id: inheritance-receipt, type: cash_receipt, start_month: 1,
            gross_amount: 260000, tax_reserve: 0,
            source_event_id: windfall-inheritance,
            label: "Inheritance from Ana's aunt" }

    # TRANSFER CASE — liquidity changes at month four, net worth does not.
    - id: inheritance-invest
      label: Invest inheritance after the pause
      baseline: current
      kind: scenario
      as_of: 2026-08-30
      horizon_months: 24
      preliminary: true
      market_return_annual: 0.05
      events:
        - { id: inheritance-receipt-invest, type: cash_receipt, start_month: 1,
            gross_amount: 260000, tax_reserve: 0,
            source_event_id: windfall-inheritance,
            label: "Inheritance from Ana's aunt" }
        - { id: diversified-transfer, type: portfolio_contribution,
            start_month: 4, amount: 200000, account_id: taxable-brokerage }

    # STOCK CASE — the same gross value is marketable property, not cash.
    - id: stock-windfall-hold
      label: Hold received stock with basis unresolved
      baseline: current
