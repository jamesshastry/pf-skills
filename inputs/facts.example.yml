# ─────────────────────────────────────────────────────────────────────
# EXAMPLE FACTS — the Rivera household (fictional)
#
# Every figure here is invented. Copy this file, replace the values:
#
#     cp inputs/facts.example.yml inputs/facts.yml
#
# inputs/facts.yml is gitignored. It never leaves your machine.
# Field definitions: SCHEMA.md
# ─────────────────────────────────────────────────────────────────────

meta:
  schema_version: 1
  as_of: 2026-08-30
  currency: USD
  jurisdiction:
    country: US
    state: TX

household:
  members:
    - id: a1
      role: primary
      citizenship: [US]
      us_status: citizen
      age: 41
      birth_year: 1985
      # INSURED CASE — a full career, well past the 40-credit threshold.
      ss_credits: 40
      income_annual: 180000
      employer: Northwind
      income_variable_share: 0.28
      income_components: { salary: 132700, bonus: 21350, equity: 25950 }
    # NON-CITIZEN SPOUSE CASE — exercises the marital-deduction branch.
    # UNINSURED CASE — a short work history. Spousal and survivor entitlement
    # is unaffected, which is the point worth stating; what changes is that
    # there is no floor of her own underneath it.
    - { id: a2, role: spouse, citizenship: [CA], us_status: permanent_resident,
        age: 39, birth_year: 1987, income_annual: 0, ss_credits: 4 }
    - { id: c1, role: dependent, age: 8 }
    - { id: c2, role: dependent, age: 5 }

  balance_sheet:
    # Joint checking — no designation possible, so the audit stays quiet.
    # NEAR-ZERO YIELD CASE — the most common unforced error on a balance sheet.
    # PROBATE: COVERED-BY-JOINT CASE — survivorship carries it, no form needed.
    - { id: cash-main, name: cash, value: 40000, tier: liquid, asset_class: cash,
        liquidity_class: cash_equivalent, retirement_eligible: false,
        titled_to: joint,
        account_type: taxable, wash_sale_policy_applied: true,
        yield_gross: 0.0001, state_tax_exempt: false,
        beneficiary_applicable: false }

    # CLEAN CASE — primary and contingent both named.
    # PROBATE: COVERED-BY-DESIGNATION CASE — individually titled, but a named
    # primary carries it outside the will anyway. Titling is not the whole
    # answer, which is the point of checking both.
    - id: taxable-brokerage
      name: brokerage
      value: 45000
      tier: liquid
      liquidity_class: marketable
      retirement_eligible: true
      titled_to: individual
      # TAXABLE EQUITY CASE — named lots include both gains and losses.
      asset_class: us_equity
      # The direct-indexed account. COVERED CASE for the wash-sale policy.
      account_type: taxable
      wash_sale_policy_applied: true
      margin_debt: 4321
      tax_lots:
        - { ticker: XOM, value: 17341, cost_basis: 11273, holding_period: long_term }
        - { ticker: PFE, value: 10629, cost_basis: 13711, holding_period: long_term }
        - { ticker: KO, value: 17030, cost_basis: 14889, holding_period: long_term }
      beneficiaries:
        - { name: Ana Rivera, member_id: a2, relationship: spouse,
            share: 100, type: primary }
        - { name: Rivera Family Trust, relationship: trust,
            share: 100, type: contingent }

    # DEFECT CASE — checked, and nothing is named. Not the same as unknown.
    # MIXED-HOLDINGS CASE — one account, three asset classes.
    # WASH-SALE GAP CASE — coverage unrecorded on a retirement account, which
    # is the expensive one: a purchase here disallows the loss permanently.
    # PROBATE: EXPOSED CASE — individually titled and the designation was
    # checked with nobody named. Nothing carries it out of the estate. On a
    # retirement account this is the expensive one, and the fix is the spouse
    # directly rather than the trust.
    - id: retirement-401k
      name: retirement_401k
      value: 310000
      tier: age_restricted
      liquidity_class: restricted
      retirement_eligible: true
      titled_to: individual
      account_type: tax_deferred
      wash_sale_policy_applied: null
      holdings:
        - { asset_class: us_equity,   value: 200000 }
        - { asset_class: intl_equity, value: 50000 }
        - { asset_class: bond,        value: 60000 }
      beneficiaries: []

    # DEFECT CASE — minors named directly. Forces a court guardianship
    # instead of the trust that exists for exactly this.
    # EARMARKED CASE — excluded from the household allocation entirely.
    # PROBATE: UNKNOWN-TITLING CASE — primaries are named so it avoids
    # probate regardless, but `titled_to` is deliberately absent to show that
    # an unrecorded field is reported as unrecorded rather than assumed.
    - id: education-529
      name: college_529
      value: 28000
      tier: illiquid
      liquidity_class: restricted
      retirement_eligible: false
      account_type: education
      # A 529 holds plan portfolios rather than individual securities, so the
      # exclusion is trivially satisfied — recorded rather than left unknown.
      wash_sale_policy_applied: true
      beneficiaries:
        - { name: Mateo Rivera, member_id: c1, relationship: child,
            share: 50, type: primary }
        - { name: Lucia Rivera, member_id: c2, relationship: child,
            share: 50, type: primary }

  annual_spending: 96000

  domicile: { country: US, state: TX, determined: true }

auto:
  vehicles:
    # KEEP CASE — 7.6% of value. Meaningful loss against $85K liquid.
    - id: v1
      label: 2019 Subaru Outback
      value: 14500
      value_basis: acv
      value_as_of: 2026-08-01
      lienholder: false
      comprehensive_premium_annual: 340
      collision_premium_annual: 760
      deductible_comprehensive: 500
      deductible_collision: 500
      primary_driver: a1

    # DROP CASE — 15.2% at the offer, still ~12% at a realistic ACV.
    # Note value_basis: instant_offer. A skill must widen the range, not
    # treat 4200 as settlement value.
    - id: v2
      label: 2012 Toyota Corolla
      value: 4200
      value_basis: instant_offer
      value_as_of: 2026-08-15
      lienholder: false
      comprehensive_premium_annual: 190
      collision_premium_annual: 450
      deductible_comprehensive: 500
      deductible_collision: 500
      primary_driver: a2

  coverage:
    bodily_injury:
      per_person: 100000
      per_accident: 300000
    property_damage:
      per_accident: 50000
    um_uim_bodily_injury:
      per_person: 30000
      per_accident: 60000
    um_property_damage: null
    medical_payments: null

  premium_annual_total: 2680
  term_months: 6

property:
  form: renters
  monthly_rent: 2400
  coverage:
    personal_property: 10000
    loss_of_use: 3000
    personal_liability: 100000      # below the $300K umbrella carriers require
    medical_payments_to_others: 1000
    deductible: 250
  settlement_basis: replacement_cost
  scheduled_items: []
  exclusions: [trampoline]
  premium_annual: 180

umbrella:
  coverage: null
  premium_annual: null

insurance:
  life:
    # KEEP CASE — cheap term, correctly structured.
    - id: l1
      label: Level Term 20
      type: term
      insured: a1
      death_benefit: 500000
      premium_annual: 420
      issued: 2021-06-06
      term_expires: 2041-06-06
      employer_provided: false
      beneficiaries:
        - { name: Ana Rivera, member_id: a2, relationship: spouse,
            share: 100, type: primary }
        - { name: Rivera Family Trust, relationship: trust,
            share: 100, type: contingent }

    # SURRENDER CASE — a cash-value policy that has returned less than the
    # premiums paid into it. Exercises the IRR branch.
    - id: l2
      label: Variable Universal Life
      type: variable_universal
      insured: a1
      death_benefit: 150000
      premium_annual: 2400
      issued: 2016-03-01
      term_expires: null
      employer_provided: false
      cash_value: 18500
      cash_value_as_of: 2026-08-01
      premiums_paid_to_date: 25200
      beneficiaries:
        - { name: Ana Rivera, member_id: a2, relationship: spouse,
            share: 100, type: primary }

    # GROUP CASE — not portable, ends with the job, and the job ending is
    # correlated with needing it.
    - id: l3
      label: Employer group life
      type: group
      insured: a1
      death_benefit: 360000
      premium_annual: 0
      issued: 2020-01-01
      term_expires: null
      employer_provided: true
      beneficiaries: []

  disability:
    # Individual, after-tax premiums, so the benefit is tax-free.
    # Carries an unexercised Future Increase rider with a live deadline.
    - id: d1
      label: Individual DI
      insured: a1
      monthly_benefit: 6500
      premium_annual: 1150
      elimination_days: 90
      benefit_period_years: 10
      definition: modified_own_occupation
      riders: [future_increase, cola, partial]
      future_increase_deadline: 2029-04-01
      employer_provided: false
      premium_paid_with: after_tax

estate:
  documents:
    - { type: will,              exists: true,  last_reviewed: 2016-05-14 }
    - { type: revocable_trust,   exists: true,  last_reviewed: 2016-05-14, funded: false }
    - { type: financial_poa,     exists: false }
    - { type: healthcare_poa,    exists: true,  last_reviewed: 2016-05-14 }
    - { type: advance_directive, exists: false }
  # Whether the will pours into the trust rather than to the spouse directly.
  # Decides whether a simplified spousal transfer stays available.
  will_pours_to_trust: true
  digital:
    password_manager: true
    emergency_access_configured: false
    account_inventory: false
    two_factor_recovery_documented: false

contributions:
  year: 2026
  employer_plan:
    plan_type: 401k
    compensation: 180000
    pay_periods: 24
    # FORFEITURE CASE — 40% of pay hits the §402(g) ceiling in about a
    # third of the year, on a per-period match, with true_up unknown.
    deferral_rate_pct: 40
    employee_pre_tax: 24500
    employee_roth: 0
    employee_after_tax: 0
    employer_match: 3600
    employer_other: 0
    in_plan_roth_conversion: null
    true_up: null
    match_formula:
      type: percent_of_pay_per_period
      rate: 0.5
      cap_pct: 0.06

  ira:
    - { member: a1, type: roth_backdoor, amount: 7500 }

  hsa:
    coverage: family
    eligible: true
    contribution: 0

debts:
  # DIVERGENCE CASE — smallest balance AND lowest rate. Snowball targets this
  # first, avalanche targets it last. Without a debt shaped like this the two
  # methods agree and the trade-off the skill exists to show never appears.
  - { name: personal_loan, kind: personal, balance: 1800, apr: 0.0300,
      minimum_payment: 60, deductible_interest: false }
  # Highest rate — avalanche targets this first.
  - { name: credit_card, kind: credit_card, balance: 6200, apr: 0.2249,
      minimum_payment: 155, deductible_interest: false }
  # The trade-off case: larger balance, lower rate.
  - { name: auto_loan, kind: auto, balance: 14800, apr: 0.0629,
      minimum_payment: 410, deductible_interest: false }
  # DEDUCTIBLE CASE — 5.85% nominal is 4.45% after tax at 24%.
  - { name: student_loan, kind: student, balance: 21500, apr: 0.0585,
      minimum_payment: 240, deductible_interest: true }

assumptions:
  # Benchmark is a Treasury fund, so it is state-tax exempt and the holdings
  # above are not — which is what exercises the after-tax branch.
  cash_benchmark_apr: 0.042
  cash_benchmark_as_of: 2026-08-30
  cash_benchmark_label: Treasury money market
  cash_benchmark_state_tax_exempt: true
  niit_rate: 0.038
  state_tax_rate: 0.0
  expected_return_apr: 0.07
  marginal_tax_rate: 0.24
  monthly_debt_extra: 600
  # Housing inputs are nominal — see SCHEMA.md. Kept separate from
  # expected_return_apr on purpose.
  nominal_investment_return: 0.07
  rent_growth: 0.03
  home_appreciation: 0.03

  # ── cluster 13: owner-operator business ──────────────────────────────
  # INVENTED FIGURES, shaped like the real ones. Asked for rather than held
  # in the repo: they are indexed annually and a stale one here would corrupt
  # every number downstream while looking exactly as confident.
  ss_wage_base: 184500
  qbi_threshold: 394600
  qbi_phase_in_range: 100000
  qualified_dividend_rate: 0.15
  deductions_total: 31500
  section_179_limit: 1250000
  section_179_phaseout: 3130000
  suv_179_cap: 31300
  bonus_depreciation_pct: 1.0
  luxury_auto_year1_cap: 20400
  luxury_auto_year1_cap_no_bonus: 12400
  standard_mileage_rate: 0.70

  # ── cluster 18: investment property ──────────────────────────────────
  # Statutory figures the library refuses to carry itself.
  # §469(i): unindexed since 1986. Verify before relying on them.
  passive_loss_allowance: 25000
  passive_loss_phaseout_start: 100000
  passive_loss_phaseout_end: 150000
  # Unrecaptured §1250 rate — higher than the long-term capital gain rate,
  # which is the point the 1031 skill turns on.
  depreciation_recapture_rate: 0.25
  # Legislated and has changed in most recent years. Do not let this go stale.
  # NOTE: this is the *property* bonus rate read by realestate.py. The
  # owner-operator equipment figure above is `bonus_depreciation_pct`, read by
  # depreciation.py — two separate keys, and they are not kept in step here.
  bonus_depreciation_rate: 0.40

  # ── cluster 17: life transitions ─────────────────────────────────────
  # Long-term rate. Separate from marginal_tax_rate because the divorce split
  # taxes pre-tax balances at one and embedded gains at the other.
  capital_gains_rate: 0.15

  # ── clusters 12 & 15: PFIC and charitable giving ─────────────────────
  # Standard deduction, QCD limit and the LTCG rate are indexed or
  # household-specific — all three read, none encoded.
  ltcg_rate: 0.15
  standard_deduction: 30000
  other_itemized_deductions: 12000
  qcd_annual_limit: 108000
  pfic_form_cost_annual: 400
  pfic_rates:
